[workspace]
resolver = "2"
members = [
    "crates/isochrone-core",
    "crates/isochrone-build",
    "crates/isochrone-server",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
# shared deps (single source of truth for versions)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
geo = "0.32"
rstar = "0.13"
osmpbf = "0.3"
isochrone-core = { path = "crates/isochrone-core" }
